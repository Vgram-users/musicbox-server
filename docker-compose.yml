services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://music:music@db:5432/music
      JWT_SECRET: dev-secret-change-me
      MEDIA_DIR: /data/media
    ports:
      - "8000:8000"
    volumes:
      - media:/data/media

volumes:
  pgdata:
  media:
